name: 编译并部署

concurrency:
  group: homepage-production-deploy
  cancel-in-progress: false

on:
  push:
    branches:
      - dev
  release:
    types:
      - published

jobs:
  build:
    name: 编译项目
    runs-on: ubuntu-latest

    steps:
      - name: 检查仓库
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 18.x

      - name: 复制 .env.example
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env
            echo ".env file does not exist. Copied .env.example to .env."
          else
            echo ".env file already exists. Skipping the copy step."
          fi

      - name: 注入和风天气环境变量
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          def normalize_host(value: str) -> str:
              value = (value or '').strip()
              if not value:
                  return value
              if value.startswith(('http://', 'https://')):
                  return value.rstrip('/')
              return f'https://{value.rstrip("/")}'

          path = Path('.env')
          lines = path.read_text().splitlines()

          api_key = os.environ.get('QWEATHER_API_KEY', '').strip()
          api_host = normalize_host(os.environ.get('QWEATHER_API_HOST', ''))

          if not api_key:
              print('::warning::Missing GitHub Secret: QWEATHER_API_KEY. Weather may be unavailable after deployment.')

          updates = {}
          if api_key:
              updates['VITE_QWEATHER_KEY'] = api_key
          if api_host:
              updates.update({
                  'VITE_QWEATHER_GEO_HOST': api_host,
                  'VITE_QWEATHER_WEATHER_HOST': api_host,
              })

          for key, value in updates.items():
              replaced = False
              for i, line in enumerate(lines):
                  if line.startswith(f'{key} = '):
                      lines[i] = f'{key} = "{value}"'
                      replaced = True
                      break
              if not replaced:
                  lines.append(f'{key} = "{value}"')
          path.write_text('\n'.join(lines) + '\n')
          PY
        env:
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          QWEATHER_API_HOST: ${{ secrets.QWEATHER_API_HOST }}

      - name: 安装 pnpm
        run: npm install -g pnpm

      - name: 安装依赖
        run: pnpm install

      - name: 编译项目
        run: pnpm build

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: deploy-dist
          path: dist

  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    needs: build

    env:
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: deploy-dist
          path: dist

      - name: 创建版本目录
        uses: appleboy/ssh-action@v1
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: RELEASE_ID
          script: |
            set -eu
            mkdir -p "/srv/www/jerryfage.top/releases/$RELEASE_ID"

      - name: 上传构建产物
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: dist/*
          target: /srv/www/jerryfage.top/releases/${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          strip_components: 1

      - name: 切换线上版本并清理旧版本
        uses: appleboy/ssh-action@v1
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: RELEASE_ID
          script: |
            set -eu

            base='/srv/www/jerryfage.top'
            release="$base/releases/$RELEASE_ID"

            # 上传不完整时禁止切换
            test -s "$release/index.html"

            # 统一静态文件和目录权限
            find "$release" -type d -exec chmod 0755 {} +
            find "$release" -type f -exec chmod 0644 {} +

            # 原子替换当前版本链接
            ln -s "$release" "$base/.current-$RELEASE_ID"
            mv -Tf "$base/.current-$RELEASE_ID" "$base/current"

            # 保留最近 5 个版本
            current="$(readlink -f "$base/current")"
            find "$base/releases" -mindepth 1 -maxdepth 1 \
              -type d -printf '%T@ %p\n' |
              sort -nr |
              tail -n +6 |
              cut -d' ' -f2- |
              while IFS= read -r old_release; do
                [ "$old_release" = "$current" ] ||
                  rm -rf -- "$old_release"
              done

            echo "Activated release: $RELEASE_ID"
