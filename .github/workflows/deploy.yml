name: 编译并部署

on:
  push:
    branches:
      - dev
  release:
    types:
      - published

jobs:
  build:
    name: 编译项目
    runs-on: ubuntu-latest

    steps:
      - name: 检查仓库
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 18.x

      - name: 复制 .env.example
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env
            echo ".env file does not exist. Copied .env.example to .env."
          else
            echo ".env file already exists. Skipping the copy step."
          fi

      - name: 注入和风天气环境变量
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path('.env')
          lines = path.read_text().splitlines()
          updates = {
              'VITE_QWEATHER_KEY': os.environ.get('QWEATHER_API_KEY', ''),
              'VITE_QWEATHER_GEO_HOST': os.environ.get('QWEATHER_API_HOST', ''),
              'VITE_QWEATHER_WEATHER_HOST': os.environ.get('QWEATHER_API_HOST', ''),
          }
          for key, value in updates.items():
              replaced = False
              for i, line in enumerate(lines):
                  if line.startswith(f'{key} = '):
                      lines[i] = f'{key} = "{value}"'
                      replaced = True
                      break
              if not replaced:
                  lines.append(f'{key} = "{value}"')
          path.write_text('\n'.join(lines) + '\n')
          PY
        env:
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          QWEATHER_API_HOST: ${{ secrets.QWEATHER_API_HOST }}

      - name: 安装 pnpm
        run: npm install -g pnpm

      - name: 安装依赖
        run: pnpm install

      - name: 编译项目
        run: pnpm build

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: deploy-dist
          path: dist

  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: deploy-dist
          path: dist

      - name: 部署到服务器
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: dist/*
          target: /home/Jerry_FaGe/home
          strip_components: 1
